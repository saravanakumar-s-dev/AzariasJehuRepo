<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFSK Bot</title>
<style>
  * { box-sizing: border-box; }
  body { background:#B6B6B4; color:#fff; font-family:Arial,sans-serif; margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:12px; }
  .container { background:rgba(0,0,0,.65); border-radius:8px; padding:20px; box-shadow:0 20px 50px rgba(0,0,0,.5); width:100%; max-width:750px; height:85vh; display:flex; flex-direction:column; }
  .title { font-size:2em; text-align:center; margin-bottom:12px; }
  .row { display:flex; gap:10px; margin-bottom:10px; }
  .row > * { flex:1; min-width:0; }
  input, select, textarea, button { padding:12px; border:none; border-radius:5px; font-size:1em; font-family:inherit; }
  button { background:#fff; color:#555; cursor:pointer; flex:0 0 auto; }
  button:hover { background:#f0f0f0; }
  #chat { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:10px; background:rgba(255,255,255,.08); border-radius:6px; margin-bottom:10px; }
  .msg { padding:10px 14px; border-radius:8px; max-width:85%; line-height:1.45; white-space:pre-line; }
  .user { align-self:flex-end; background:#fff; color:#333; }
  .bot { align-self:flex-start; background:rgba(255,255,255,.15); border:1px solid #A0A0A0; }
  .hint { font-size:.85em; color:#ccc; margin-top:6px; }
  .hint span { text-decoration:underline; cursor:pointer; }
  .error { color:#ff8080; margin-bottom:8px; font-size:.9em; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:2px solid #fff; outline-offset:2px; }
</style>
</head>
<body>
<div class="container">
  <div class="title">Welcome to NFSK Bot</div>
  <div class="row">
    <input type="text" id="name" placeholder="Your name">
    <select id="subject">
      <option value="all">All subjects</option>
      <option value="biology">Biology</option>
      <option value="chemistry">Chemistry</option>
      <option value="physics">Physics</option>
      <option value="algebra">Algebra</option>
      <option value="arithmetic">Arithmetic</option>
      <option value="geometry">Geometry</option>
      <option value="measurement">Measurement</option>
      <option value="number system">Number System</option>
    </select>
  </div>
  <div id="chat"><div class="msg bot">Hi! Ask me anything about Biology, Chemistry, Physics, Algebra, Arithmetic, Geometry, Measurement or the Number System. Capital letters, small letters, spelling mistakes and missing punctuation are all fine. You can also type sums like 12 + 5 * 3.</div></div>
  <div id="err" class="error"></div>
  <div class="row">
    <textarea id="question" rows="2" placeholder="What is your question?"></textarea>
    <button id="send">Send 📩</button>
  </div>
</div>

/* ---------- Text cleaning & fuzzy matching ---------- */
const STOP = new Set("a an the is are was were of in on to for and or what whats which who how do does did tell me about name define explain give please can you i my it its this that there has have with be by as at from kind type called mean means meaning".split(" "));
const SYN = { centre:"center", metre:"meter", litre:"liter", millimetre:"millimeter", centimetre:"centimeter", kilometre:"kilometer", squared:"square", cm:"centimeter", mm:"millimeter", km:"kilometer", kg:"kilogram", ml:"milliliter" };

function clean(t) {
  return t.toLowerCase().replace(/[’']/g, "").replace(/[^a-z0-9\u00b2\u00b3+\-*/^.= ]/g, " ").replace(/\s+/g, " ").trim();
}
function stem(w) {
  w = SYN[w] || w;
  if (w.length > 4 && w.endsWith("ies")) return w.slice(0, -3) + "y";
  if (w.length > 3 && w.endsWith("s") && !w.endsWith("ss")) return w.slice(0, -1);
  return w;
}
function tokens(t) {
  return clean(t).replace(/[+\-*/^=.]/g, " ").split(" ").filter(w => w && !STOP.has(w)).map(stem);
}
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({length: n + 1}, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function sameWord(a, b) {
  if (a === b) return 1;
  if (/^\d+$/.test(a) || /^\d+$/.test(b)) return 0;
  const tol = Math.max(a.length, b.length) >= 8 ? 2 : Math.max(a.length, b.length) >= 4 ? 1 : 0;
  return tol && lev(a, b) <= tol ? 0.85 : 0;
}
function similarity(qt, pt) {
  if (!qt.length || !pt.length) return 0;
  let hit = 0;
  for (const p of pt) { let best = 0; for (const q of qt) best = Math.max(best, sameWord(q, p)); hit += best; }
  let hitQ = 0;
  for (const q of qt) { let best = 0; for (const p of pt) best = Math.max(best, sameWord(q, p)); hitQ += best; }
  return (hit / pt.length + hitQ / qt.length) / 2;
}

const INDEX = [];
for (const [subj, list] of Object.entries(KB))
  for (const [phrases, ans] of list)
    INDEX.push({ subj, ans, pts: phrases.map(tokens), title: phrases[0] });

function search(question, subject) {
  const qt = tokens(question);
  let best = null;
  for (const e of INDEX) {
    let s = 0;
    for (const pt of e.pts) s = Math.max(s, similarity(qt, pt));
    if (subject !== "all" && e.subj === subject) s += 0.05;
    if (!best || s > best.s) best = { s, e };
  }
  return best;
}

/* ---------- Calculator for arithmetic questions ---------- */
function tryMath(q) {
  let t = q.toLowerCase().replace(/[,?]/g, "")
    .replace(/\bplus\b/g, "+").replace(/\bminus\b/g, "-").replace(/\b(times|multiplied by|x)\b/g, "*")
    .replace(/\b(divided by|over)\b/g, "/").replace(/[×]/g, "*").replace(/[÷]/g, "/").replace(/\^/g, "**")
    .replace(/(\d+(\.\d+)?)\s*%\s*of\s*(\d+(\.\d+)?)/g, "($1/100*$3)")
    .replace(/square root of (\d+(\.\d+)?)/g, "Math.sqrt($1)").replace(/√\s*(\d+(\.\d+)?)/g, "Math.sqrt($1)")
    .replace(/(\d+(\.\d+)?)\s*(squared)/g, "($1**2)").replace(/(\d+(\.\d+)?)\s*(cubed)/g, "($1**3)");
  t = t.replace(/^(what is|whats|calculate|solve|find|compute|evaluate|how much is)\s+/, "").replace(/\s*=\s*\??$/, "").trim();
  if (!/\d/.test(t) || !/[-+*/]|Math\.sqrt/.test(t)) return null;
  if (!/^[\d\s+\-*/().]*(Math\.sqrt\([\d.]+\)[\d\s+\-*/().]*)*$/.test(t)) return null;
  try {
    const v = Function('"use strict";return (' + t + ")")();
    if (typeof v !== "number" || !isFinite(v)) return "That calculation is not defined (for example, dividing by zero).";
    return "Answer: " + Math.round(v * 1e9) / 1e9;
  } catch (e) { return null; }
}

/* ---------- UI ---------- */
const chat = document.getElementById("chat");
function add(text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
function suggest(div, title) {
  const h = document.createElement("div");
  h.className = "hint";
  h.append("Did you mean: ");
  const s = document.createElement("span");
  s.textContent = title;
  s.onclick = () => { document.getElementById("question").value = title; ask(); };
  h.appendChild(s);
  h.append("?");
  div.appendChild(h);
}
function ask() {
  const name = document.getElementById("name").value.trim();
  const subject = document.getElementById("subject").value;
  const qEl = document.getElementById("question");
  const question = qEl.value.trim();
  const err = document.getElementById("err");
  if (!question) { err.textContent = "Please type your question."; return; }
  err.textContent = "";
  add(question, "user");
  qEl.value = "";
  const hi = name ? name + ", " : "";

  const math = tryMath(question);
  if (math) { add(math, "bot"); return; }

  if (/^(hi|hello|hey|hii+|good (morning|afternoon|evening))\b/.test(clean(question)) && tokens(question).length <= 2) {
    add("Hello" + (name ? " " + name : "") + "! What would you like to learn today?", "bot"); return;
  }
  const r = search(question, subject);
  if (r.s >= 0.6) {
    let txt = r.e.ans;
    if (subject !== "all" && r.e.subj !== subject) txt = "(This looks like a " + r.e.subj + " question.)\n" + txt;
    add(txt, "bot");
  } else if (r.s >= 0.38) {
    const d = add(hi + "I'm not fully sure what you meant.", "bot");
    suggest(d, r.e.title);
  } else {
    add(hi + "NFSK Bot is still learning this one. Try rephrasing it, choose a subject, or ask your teacher.", "bot");
  }
}
document.getElementById("send").onclick = ask;
document.getElementById("question").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); }
});
</script>
